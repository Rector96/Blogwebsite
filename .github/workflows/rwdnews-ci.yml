name: RWDNEWS CI

on:
  push:
    branches:
      - main
      - phase-4-admin-monetization
  pull_request:
    branches:
      - main
      - phase-4-admin-monetization

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run lint
      - run: bun run build
