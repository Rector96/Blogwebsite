name: RWDNEWS CI

on:
  push:
    branches:
      - main
      - phase-4-admin-monetization
  pull_request:
    branches:
      - main
      - phase-4-admin-monetization

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build
