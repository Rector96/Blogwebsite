name: RockBrief CI

on:
  push:
    branches:
      - main
      - "consolidated/**"
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-package-lock

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build
