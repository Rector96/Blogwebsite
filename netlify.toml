[build]
  command = "npm install --no-package-lock && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22.14.0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/news"
  to = "/.netlify/functions/news"
  status = 200
  force = true

[[redirects]]
  from = "/api/sports"
  to = "/.netlify/functions/sports"
  status = 200
  force = true

[[redirects]]
  from = "/api/sports-prediction"
  to = "/.netlify/functions/sports-prediction"
  status = 200
  force = true

[[redirects]]
  from = "/api/cron/ingest"
  to = "/.netlify/functions/cron-ingest"
  status = 200
  force = true

[[redirects]]
  from = "/api/paystack/init"
  to = "/.netlify/functions/paystack-init"
  status = 200
  force = true

[[redirects]]
  from = "/api/paystack/verify"
  to = "/.netlify/functions/paystack-verify"
  status = 200
  force = true

[[redirects]]
  from = "/api/paystack/webhook"
  to = "/.netlify/functions/paystack-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/track"
  to = "/.netlify/functions/track"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

# Keep /sports URLs working if anyone bookmarks them
[[redirects]]
  from = "/sports"
  to = "/sport"
  status = 301

[[redirects]]
  from = "/sports/predictions"
  to = "/sport/predictions"
  status = 301

[[redirects]]
  from = "/sports/predictions/*"
  to = "/sport/predictions/:splat"
  status = 301

# SPA fallback MUST NOT use force=true or JS/CSS assets become HTML and the site goes blank
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
