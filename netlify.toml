[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/news"
  to = "/.netlify/functions/news"
  status = 200
  force = true

[[redirects]]
  from = "/api/sports"
  to = "/.netlify/functions/sports"
  status = 200
  force = true

[[redirects]]
  from = "/api/sports-prediction"
  to = "/.netlify/functions/sports-prediction"
  status = 200
  force = true

[[redirects]]
  from = "/api/cron/ingest"
  to = "/.netlify/functions/cron-ingest"
  status = 200
  force = true

[[redirects]]
  from = "/api/paystack/init"
  to = "/.netlify/functions/paystack-init"
  status = 200
  force = true

[[redirects]]
  from = "/api/paystack/verify"
  to = "/.netlify/functions/paystack-verify"
  status = 200
  force = true

[[redirects]]
  from = "/api/paystack/webhook"
  to = "/.netlify/functions/paystack-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/track"
  to = "/.netlify/functions/track"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200
  force = true

# Canonical sports URLs
[[redirects]]
  from = "/sports"
  to = "/sport"
  status = 301
  force = true

[[redirects]]
  from = "/sports/predictions"
  to = "/sport/predictions"
  status = 301
  force = true

[[redirects]]
  from = "/sports/predictions/*"
  to = "/sport/predictions/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

# Static SEO files must win over the SPA fallback
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = false

[[redirects]]
  from = "/googled7fe6a30225300ca.html"
  to = "/googled7fe6a30225300ca.html"
  status = 200
  force = false

# SPA fallback last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
